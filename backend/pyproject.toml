[project]
name = "counterpart-backend"
version = "0.1.0"
description = "Counterpart: an agentic marketing system for small businesses (HR26-AI-02)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qrcode[pil]>=8.0",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
