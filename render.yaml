# Render Blueprint for the API. Frontend goes on Vercel (root directory: frontend). See docs/DEPLOY.md.
services:
  - type: web
    name: counterpart-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: DEMO_PASSWORD
        generateValue: true
      - key: OWNER_API_TOKEN
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
